<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="./Asset/css/style.css">
  <link rel="stylesheet" href="./Asset/css/Register.css">
  <!-- bootstrap css  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- fontawesome  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>


  <div class="reg-page">

    <div class="signup-card text-center">
      <p class="mb-1">Have an account? <a href="login.html" class="text-light log">Login</a></p>
      <h3 class="mb-4">Sign Up</h3>
      <form id="signupForm">
        <div class="row mb-3">
          <div class="col">
            <input type="text" class="form-control input" id="firstname" placeholder="Firstname" required>
          </div>
          <div class="col">
            <input type="text" class="form-control input" id="lastname" placeholder="Lastname" required>
          </div>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control input" id="email" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control input" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-register w-100 ">Register</button>
        <div class="bottom-links">
          <div>
            <input type="checkbox" id="remember"> <label for="remember">Remember Me</label>
          </div>
          <a href="#" class="text-white text-decoration-none">Terms & conditions</a>
        </div>
      </form>
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("signupForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const firstname = document.getElementById("firstname").value.trim();
      const lastname = document.getElementById("lastname").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (firstname && lastname && email && password) {
        alert(`Welcome ${firstname}! Your account has been created.`);
        // You can redirect or send data to backend here
      } else {
        alert("Please fill in all fields.");
      }
    });

  </script>



</body>

</html>
