<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="./Asset/css/style.css">
  <link rel="stylesheet" href="./Asset/css/Register.css">
  <!-- bootstrap css  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- fontawesome  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>


  <div class="reg-page">

    <div class="signup-card text-center">
      <p class="mb-1">Have an account? <a href="login.html" class="text-light log">Login</a></p>
      <h3 class="mb-4">Sign Up</h3>
      <form id="signupForm">
        <div class="row mb-3">
          <div class="col">
            <input type="text" class="form-control input" id="firstname" placeholder="Firstname" required>
          </div>
          <div class="col">
            <input type="text" class="form-control input" id="lastname" placeholder="Lastname" required>
          </div>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control input" id="email" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control input" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-register w-100 ">Register</button>
        <div class="bottom-links">
          <div>
            <input type="checkbox" id="remember"> <label for="remember">Remember Me</label>
          </div>
          <a href="#" class="text-white text-decoration-none">Terms & conditions</a>
        </div>
      </form>
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="Asset/js/common.js"></script>
  <script>
    document.getElementById("signupForm").addEventListener("submit", function (e) {

    e.preventDefault();

    const firstname = document.getElementById("firstname").value.trim();
    const lastname = document.getElementById("lastname").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

     // Firstname
    if (firstname === "") {
        alert("Firstname is required");
        return;
    }


    // Lastname
    if (lastname === "") {
        alert("Lastname is required");
        return;
    }


    // Email
    if (email === "") {
        alert("Email is required");
        return;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        alert("Please enter a valid email address");
        return;
    }


    // Password
    if (password === "") {
        alert("Password is required");
        return;
    }

    const passwordPattern =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{6,}$/;

    if (!passwordPattern.test(password)) {
        alert(
            "Password must contain:\n\n" +
            "• At least 6 characters\n" +
            "• At least 1 uppercase letter\n" +
            "• At least 1 lowercase letter\n" +
            "• At least 1 number\n" +
            "• At least 1 special character"
        );
        return;
    }


    // Get existing users
    let users = JSON.parse(localStorage.getItem("users")) || [];


    // Check whether email already exists
    const existingUser = users.find(
        user => user.email === email
    );

    if (existingUser) {
        alert("This email is already registered!");
        return;
    }


    // Create user
    const user = {
        firstname: firstname,
        lastname: lastname,
        email: email,
        password: password
    };


    // Add user
    users.push(user);


    // Save users
    localStorage.setItem("users", JSON.stringify(users));


    // Success
    alert("Registration Successful! 🎉");


    // Go to home page
    window.location.href = "login.html";

});
  </script>



</body>

</html>
