<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="./Asset/css/login.css">
</head>

<body>
  <div class="log-in">
    <div class="login-card">
      <p class="mb-1">Don’t have an account? <a href="Register.html">Register Now</a></p>
      <h3 class="mb-4">Login</h3>

      <form id="loginForm">
        <div class="input-group">
          <i class="fa-regular fa-user input-icon"></i>
          <input type="text" class="form-control" id="username" placeholder="Username or Email" required>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" class="form-control" id="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn btn-login w-100 mt-2">Sign In</button>

        <div class="bottom-links">
          <div>
            <input type="checkbox" id="remember"> <label for="remember">Remember Me</label>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>

document.getElementById("loginForm").addEventListener("submit", function (e) {

    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    // Required validation
    if (username === "") {
        alert("Username or Email is required");
        return;
    }

    if (password === "") {
        alert("Password is required");
        return;
    }

    // Get registered users
    let users = JSON.parse(localStorage.getItem("users")) || [];

    // Find user
    const user = users.find(item =>
        (item.email === username || item.firstname === username) &&
        item.password === password
    );

    if (user) {

        // Login status
        localStorage.setItem("isLoggedIn", "true");

        // Save current user's details
        localStorage.setItem(
            "username",
            user.firstname + " " + user.lastname
        );

        localStorage.setItem(
            "email",
            user.email
        );

        alert("Login Successful! 🎉");

        // Go to home page
        window.location.href = "index.html";

    } else {

        alert("Invalid username/email or password");

    }

});

  </script>
</body>

</html>
